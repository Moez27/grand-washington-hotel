security:
    # Hachage des mots de passe : "auto" = bcrypt / argon2id selon la plateforme
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build|css|js|uploads|img)/)
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
                username_parameter: _username
                password_parameter: _password
            logout:
                path: app_logout
                target: app_home
                enable_csrf: true
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                secure: auto
                samesite: lax
            # Anti brute-force : 5 tentatives / minute / (IP + identifiant)
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

    # Seule la première règle qui correspond est appliquée
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/mon-compte, roles: ROLE_USER }
        - { path: ^/panier/valider, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
